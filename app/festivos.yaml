# Festivos de Madrid capital: los nacionales, los de la Comunidad de Madrid y los del Ayuntamiento.
# Son 14 al año. Hay que añadir cada año cuando se publiquen (otoño del año anterior):
#
# - Nacionales: resolución de la Dirección General de Trabajo en el BOE (fiestas comunes a toda España).
# - Comunidad: decreto del Consejo de Gobierno en el BOCM (los que la Comunidad elige y los traslados a lunes).
# - Madrid capital: las dos fiestas locales del Ayuntamiento (San Isidro y La Almudena).
#
# 2026: Decreto 75/2025, de 24 de septiembre (BOCM). 2027: BOE de 13 de octubre de 2026 y Decreto 82/2026,
# de 30 de septiembre (BOCM núm. 234, de 1 de octubre de 2026).
# ambito: nacional | comunidad | local


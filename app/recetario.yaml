# Recetario del menú semanal: cocina mediterránea sencilla. Cantidades para 2 personas (el panel las escala si
# en config.yaml «menu.personas» es otro número).
#
# - comida / cena: en qué momento del día puede salir.
# - grupo: lo que usa el plan semanal para equilibrar (app/menu.py): legumbre, pescado, carne_blanca, carne_roja,
#   cereal, huevo, verdura.
# - ingredientes: {nombre, cantidad, unidad, seccion}. Para sumar la lista de la semana, el mismo ingrediente se
#   escribe siempre igual. Unidades: g, ml, ud, diente, lata, manojo, barra.
# - Lo de la despensa de siempre (aceite, sal, especias…) va en «basicos»: no sale en la lista para comprar.
#
# Para añadir o quitar platos basta con editar este fichero.

basicos: [Aceite de oliva virgen extra, Sal, Pimienta, Pimentón dulce, Comino, Curry, Orégano, Laurel, Vinagre,
          Harina, Salsa de soja]


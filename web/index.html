<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7EEE2">
  <title>Cocina</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Pantalla de bloqueo: cielo según la hora, reloj, tiempo y los avatares para entrar -->
  <section id="lock" class="screen sky" aria-label="Pantalla de bloqueo">
    <div class="lock-top">
      <div class="lock-clock" id="lock-clock">--:--</div>
      <div class="lock-date" id="lock-date"></div>
      <div class="lock-weather" id="lock-weather"></div>
    </div>
    <div class="lock-bottom">
      <p class="lock-hint">¿Quién eres?</p>
      <div class="avatars" id="avatars"></div>
      <p class="lock-power" id="lock-power"></p>
    </div>
  </section>

  <!-- Vista principal: lo común y lo de la persona que ha entrado -->
  <section id="main" class="screen" hidden aria-label="Panel">
    <header class="band sky" id="band">
      <div class="band-time">
        <div class="band-clock" id="clock">--:--</div>
        <div class="band-date" id="date"></div>
      </div>
      <div class="band-weather" id="weather"></div>
      <button class="me" id="me" aria-label="Cambiar de persona"></button>
    </header>

    <div class="grid">
      <div class="col">
        <article class="card commute" id="commute"></article>
        <article class="card fill" id="calendar"></article>
      </div>
      <div class="col">
        <article class="card fill" id="energy"></article>
      </div>
      <div class="col">
        <article class="card" id="car"></article>
        <article class="card fill" id="shopping"></article>
      </div>
    </div>
    <p class="offline" id="offline" hidden>Sin conexión con el servidor: se muestran los últimos datos.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>

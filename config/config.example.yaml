# Copia este fichero como config/config.yaml y ajústalo. config.yaml está en .gitignore.
# El token de Home Assistant NO va aquí: va en .env (HA_TOKEN).

home_assistant:
  # URL de Home Assistant vista desde el contenedor (red local).
  url: http://192.168.1.10:8123

ubicacion:
  # Para el tiempo (Open-Meteo). Coordenadas de casa.
  latitud: 0.0
  longitud: 0.0
  zona: Europe/Madrid

# Los avatares de la pantalla de bloqueo. Sin PIN: se toca el avatar y se entra.
# «trayecto»: sensor de tiempo de viaje de esa persona (p. ej. Waze Travel Time), en minutos.
usuarios:
  - id: pablo
    nombre: Pablo
    color: "#3F7FD9"
    destino: Trabajo
    trayecto: sensor.trayecto_pablo
  - id: rim
    nombre: Rim
    color: "#C8243B"
    destino: Trabajo
    trayecto: sensor.trayecto_rim

# Calendario compartido de Apple (iCloud), leído con la integración CalDAV de Home Assistant.
calendario:
  entidad: calendar.rim_y_pablo
  dias: 14   # desde el lunes de esta semana (mínimo 14: esta semana y la siguiente)

# Listas de Recordatorios de Apple que enseña el panel. Las envía un Atajo del iPhone (docs/RECORDATORIOS.md).
# La primera es la de la compra. Los nombres, tal cual están en Recordatorios.
recordatorios:
  listas:
    - Compra
    - Casa

# El Tesla. Los nombres dependen de la integración (Tesla Fleet, Teslemetry, Tessie…):
# compruébalos en Ajustes → Dispositivos → tu coche. Deja vacío lo que no tengas.
coche:
  nombre: Tesla
  entidades:
    bateria: sensor.tesla_battery_level
    autonomia: sensor.tesla_battery_range
    cargando: sensor.tesla_charging
    enchufado: binary_sensor.tesla_charge_cable
    potencia_carga: sensor.tesla_charger_power
    limite_carga: number.tesla_charge_limit
    cuentakilometros: sensor.tesla_odometer
    ruedas:
      del_izq: sensor.tesla_tire_pressure_front_left
      del_der: sensor.tesla_tire_pressure_front_right
      tras_izq: sensor.tesla_tire_pressure_rear_left
      tras_der: sensor.tesla_tire_pressure_rear_right

# Recomendaciones según el PVPC: el tramo de N horas seguidas más barato desde ahora (hoy o mañana),
# solo si su media está por debajo de la media de su día.
# La casa (vista «Casa»). Es la única parte del panel que da órdenes a Home Assistant, y solo sobre estas
# entidades. Quita los bloques que no tengas. Los nombres de entidad, de Ajustes → Entidades.
casa:
  calefaccion:
    nombre: Calefacción
    termostato: climate.sala_de_estar        # p. ej. Netatmo Smart Thermostat (la caldera)
    nombre_termostato: Salón
    presets:                                 # los que se pueden elegir desde la tablet, con su nombre
      schedule: Programa
      away: Fuera
      boost: Boost
      frost_guard: Antihielo
    valvulas:                                # válvulas termostáticas (opcional)
      - {entidad: climate.dormitorio, nombre: Dormitorio}
  aire:
    modos: [off, heat, cool, heat_cool]      # los que se pueden elegir desde la tablet
    equipos:
      - {entidad: climate.salon_aire, nombre: Salón}
  temperaturas:                              # sensores de temperatura de las estancias
    - {entidad: sensor.cocina_temperatura, nombre: Cocina}
    - {entidad: sensor.terraza_temperatura, nombre: Terraza}
  musica:
    entidad: media_player.echo_dot_cocina    # Alexa Media Player (o Sonos, HomePod…)
    nombre: Cocina

# Vista «Consumo» (solo lectura): potencia de la casa y de cada aparato, y el consumo de hoy por horas.
consumo:
  # Los mismos sensores que el panel de Energía de HA («Consumo de la red»). Si son varios, se suman: p. ej. el Shelly
  # del cuadro (la casa, sin el cargador) y el V2C Trydan (el coche).
  potencia_total:                                 # W
    - sensor.shelly_casa_potencia
    - sensor.v2c_trydan_charge_power
  energia_total:                                  # kWh acumulados (total_increasing): el consumo por horas
    - sensor.shelly_casa_energia
    - sensor.v2c_trydan_charge_energy
  # Con un solo sensor vale también «potencia_total: sensor.x». Sin energia_total, las horas se calculan con la potencia.
  tension: sensor.casa_tension                    # opcional
  intensidad: sensor.casa_intensidad              # opcional
  aparatos:
    - {entidad: sensor.cocina_potencia, nombre: Cocina}
    - {entidad: sensor.v2c_trydan_charge_power, nombre: Cargador del coche}

# Calendarios que solo enseña el panel, junto al de «RIM Y PABLO» (docs/CALENDARIOS.md). Opcional: sin esta sección
# salen los festivos, la F1 y los partidos del Real Madrid y del Barça (todas las competiciones).
calendarios_extra:
  festivos: true      # nacionales, Comunidad de Madrid y Madrid capital (app/festivos.yaml)
  f1: true            # todas las sesiones de cada Gran Premio (API pública Jolpica)
  equipos:            # un calendario .ics por equipo; [] para quitarlos
    - {nombre: Real Madrid, ics: "https://ics.fixtur.es/v2/real-madrid.ics", color: "#7A5BC2"}
    - {nombre: Barça, ics: "https://ics.fixtur.es/v2/fc-barcelona.ics", color: "#004D98"}

# Menú semanal (docs/MENU.md). Opcional: sin esta sección, para 2 personas y a la primera lista de recordatorios.
menu:
  personas: 2
  lista_compra: Compra

energia:
  recomendaciones:
    - {id: coche, nombre: Cargar el Tesla, emoji: "🚗", horas: 4}
    - {id: lavavajillas, nombre: Lavavajillas, emoji: "🍽️", horas: 2}
    - {id: lavadora, nombre: Lavadora, emoji: "🧺", horas: 2}

pantalla:
  # Vuelve a la pantalla de bloqueo tras estos segundos sin tocar.
  volver_al_bloqueo_s: 120

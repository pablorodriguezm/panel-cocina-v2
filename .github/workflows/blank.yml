# Pruebas en cada rama y PR. Al llegar a main: imagen nueva en GitHub Container Registry y su etiqueta
# escrita en deploy/portainer-compose.yml. Ese commit es lo que ve Portainer (GitOps por sondeo) para
# redesplegar: Portainer CE no tiene «Re-pull image», así que con «latest» no se enteraría.
name: Pruebas e imagen

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write   # para el commit con la etiqueta nueva en deploy/
  packages: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  imagen:
    needs: pruebas
    # Los commits del propio workflow llevan [skip ci] y no lo vuelven a lanzar
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          # ZimaOS suele ir en x86; arm64 por si el servidor es ARM
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Apuntar el despliegue a la imagen nueva
        env:
          REPO: ${{ github.repository }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${REPO,,}:${TAG}"
          sed -i -E "s#^(\s*image:).*#\1 ${IMAGE}#" deploy/portainer-compose.yml
          grep -n "image:" deploy/portainer-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Despliegue: ${TAG} [skip ci]" || exit 0
          git push
